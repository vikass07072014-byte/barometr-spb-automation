name: Daily Barometr SPB

on:
  workflow_dispatch:
    inputs:
      use_sample_weather:
        description: Use bundled sample instead of live MET Norway API
        required: true
        default: true
        type: boolean
      publish:
        description: Publish to Instagram after generation
        required: true
        default: false
        type: boolean
      forecast_date:
        description: Optional forecast date in YYYY-MM-DD format
        required: false
        default: ""
        type: string
      publish_date:
        description: Optional Buffer publication date in YYYY-MM-DD format
        required: false
        default: ""
        type: string
  schedule:
    - cron: "50 4 * * *"

permissions:
  contents: write

concurrency:
  group: daily-barometr-spb
  cancel-in-progress: false

jobs:
  daily:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch MET Norway Weather
        if: github.event_name == 'schedule' || inputs.use_sample_weather == false
        shell: bash
        run: |
          fetch_flags=()
          if [ -n "${{ inputs.forecast_date }}" ]; then
            fetch_flags+=(--forecast-date "${{ inputs.forecast_date }}")
          fi
          python src/fetch_weather.py \
            --lat 59.9343 \
            --lon 30.3351 \
            --timezone Europe/Moscow \
            --output data/weather.json \
            "${fetch_flags[@]}"

      - name: Select weather file
        shell: bash
        run: |
          if [ -f data/weather.json ]; then
            echo "WEATHER_FILE=data/weather.json" >> "$GITHUB_ENV"
          else
            echo "WEATHER_FILE=data/weather.example.json" >> "$GITHUB_ENV"
          fi

      - name: Render and validate
        shell: bash
        run: |
          render_flags=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" != "true" ]; then
            render_flags+=(--preview)
          fi
          python src/render_card.py --weather "$WEATHER_FILE" --output docs/latest.jpg "${render_flags[@]}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" != "true" ]; then
            python src/validate_card.py docs/latest.jpg --manifest docs/latest-manifest.json --allow-warnings
          else
            python src/validate_card.py docs/latest.jpg --manifest docs/latest-manifest.json
          fi
          python src/build_caption.py --weather "$WEATHER_FILE" --manifest docs/latest-manifest.json --output docs/latest-caption.txt
          forecast_date=$(python -c "import json; print(json.load(open('$WEATHER_FILE', encoding='utf-8'))['tomorrow']['date'])")
          cp docs/latest.jpg "docs/barometr-spb-$forecast_date.jpg"
          cp docs/latest-caption.txt "docs/barometr-spb-$forecast_date-caption.txt"
          cp docs/latest-manifest.json "docs/barometr-spb-$forecast_date-manifest.json"
          echo "FORECAST_DATE=$forecast_date" >> "$GITHUB_ENV"

      - name: Commit generated card
        shell: bash
        run: |
          git config user.name "barometr-spb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Generate forecast card [skip ci]"
          git push

      - name: Wait for public card URL
        if: inputs.publish == true || (github.event_name == 'schedule' && vars.AUTO_PUBLISH == 'true')
        shell: bash
        run: |
          image_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/barometr-spb-${FORECAST_DATE}.jpg?run=${GITHUB_RUN_ID}"
          expected_hash=$(sha256sum docs/latest.jpg | cut -d ' ' -f 1)
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$image_url" --output /tmp/public-card.jpg; then
              actual_hash=$(sha256sum /tmp/public-card.jpg | cut -d ' ' -f 1)
              if [ "$actual_hash" = "$expected_hash" ]; then
                echo "IMAGE_URL=$image_url" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "GitHub Pages did not expose the exact generated card in time" >&2
          exit 1

      - name: Schedule with Buffer
        if: inputs.publish == true || (github.event_name == 'schedule' && vars.AUTO_PUBLISH == 'true')
        env:
          AUTO_PUBLISH: "true"
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        shell: bash
        run: |
          publish_flags=()
          if [ -n "${{ inputs.publish_date }}" ]; then
            publish_flags+=(--publish-date "${{ inputs.publish_date }}")
          elif [ -n "${{ inputs.forecast_date }}" ]; then
            publish_flags+=(--publish-date "${{ inputs.forecast_date }}")
          fi
          python src/publish_buffer.py \
            --image-url "$IMAGE_URL" \
            --caption docs/latest-caption.txt \
            --manifest docs/latest-manifest.json \
            --receipt docs/schedule-receipt.json \
            --publish-time "08:00" \
            --timezone "Europe/Moscow" \
            "${publish_flags[@]}"
          cp docs/schedule-receipt.json "docs/schedule-receipt-$FORECAST_DATE.json"
          python src/update_history.py \
            --venues data/venues.json \
            --manifest docs/latest-manifest.json \
            --receipt docs/schedule-receipt.json

      - name: Commit Buffer schedule receipt and venue history
        if: inputs.publish == true || (github.event_name == 'schedule' && vars.AUTO_PUBLISH == 'true')
        shell: bash
        run: |
          git config user.name "barometr-spb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/venues.json docs/schedule-receipt.json "docs/schedule-receipt-$FORECAST_DATE.json"
          git diff --cached --quiet || git commit -m "Record Buffer schedule [skip ci]"
          git push
